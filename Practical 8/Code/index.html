<!DOCTYPE html>
<html>
<head>
    <title>Gym Admission Form</title>

    <style>
    * {
        box-sizing: border-box;
    }

    :root {
        --dark: #263238;
        --dark-light: #37474f;
        --green: #26a69a;
        --green-dark: #168f84;
        --bg: #f2f5f4;
        --white: #ffffff;
        --text: #263238;
        --muted: #7b8588;
        --border: #d8dfdf;
        --error: #d94b4b;
        --success: #2e7d32;
    }

    body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, "Segoe UI", sans-serif;
        background: var(--bg);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 25px;
    }

    .container {
        width: min(950px, 100%);
        background: white;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
    }

    .side {
        position: relative;
        overflow: hidden;
        padding: 25px 38px;
        min-height: 250px;
        background: var(--dark);
        color: white;
        display: grid;
        grid-template-columns: 1fr 1.3fr 1.5fr;
        align-items: center;
        gap: 25px;
    }

    .side::before {
        content: "";
        position: absolute;
        width: 250px;
        height: 250px;
        border: 2px solid rgba(38, 166, 154, 0.18);
        border-radius: 50%;
        top: -150px;
        right: 80px;
    }

    .side::after {
        content: "";
        position: absolute;
        width: 160px;
        height: 160px;
        border: 25px solid rgba(255, 255, 255, 0.03);
        border-radius: 50%;
        left: -90px;
        bottom: -100px;
    }

    .logo {
        position: absolute;
        top: 20px;
        left: 38px;
        z-index: 2;
        font-size: 19px;
        font-weight: 800;
        letter-spacing: 2px;
    }

    .logo span {
        color: var(--green);
    }

    .side-content {
        position: relative;
        z-index: 2;
        margin-top: 25px;
    }

    .side-icon {
        width: 48px;
        height: 48px;
        border-radius: 10px;
        background: rgba(38, 166, 154, 0.12);
        border: 1px solid rgba(38, 166, 154, 0.35);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        margin-bottom: 10px;
    }

    .side-content h1 {
        font-size: 29px;
        line-height: 1.05;
        margin: 0 0 8px;
    }

    .side-content h1 span {
        color: var(--green);
    }

    .side-content p {
        color: #b7c0c2;
        font-size: 12px;
        line-height: 1.5;
        max-width: 270px;
        margin: 0;
    }

    .side-bottom {
        position: relative;
        z-index: 2;
        margin-top: 25px;
    }

    .mini-info {
        display: flex;
        gap: 8px;
        margin-bottom: 12px;
    }

    .mini-box {
        flex: 1;
        padding: 10px;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .mini-box strong {
        display: block;
        color: white;
        font-size: 15px;
        margin-bottom: 3px;
    }

    .mini-box span {
        color: #899396;
        font-size: 8px;
        text-transform: uppercase;
        letter-spacing: 0.7px;
    }

    .credit {
        color: #7e888b;
        font-size: 9px;
        line-height: 1.5;
    }

    .credit strong {
        color: #c0c7c8;
        font-weight: 600;
    }

    .form-area {
        padding: 38px 55px 42px;
        background: #ffffff;
    }

    .form-wrapper {
        width: 100%;
    }

    .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 25px;
    }

    .header-label {
        color: var(--green-dark);
        font-size: 9px;
        font-weight: 800;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-bottom: 6px;
    }

    h2 {
        margin: 0;
        color: var(--text);
        font-size: 28px;
        font-weight: 800;
    }

    h2 span {
        color: var(--green);
    }

    .form-number {
        width: 36px;
        height: 36px;
        border-radius: 6px;
        background: #f4f7f7;
        border: 1px solid var(--border);
        color: #7c8588;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        font-weight: 700;
    }

    .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        column-gap: 22px;
    }

    .field {
        margin-bottom: 12px;
    }

    label {
        display: block;
        color: #465054;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.8px;
        text-transform: uppercase;
        margin-bottom: 6px;
    }

    input,
    select {
        width: 100%;
        height: 43px;
        padding: 0 12px;
        border: 1px solid var(--border);
        border-radius: 5px;
        outline: none;
        background: #fafcfc;
        color: var(--text);
        font-size: 13px;
        transition: 0.2s ease;
    }

    input::placeholder {
        color: #a3abad;
    }

    input:focus,
    select:focus {
        border-color: var(--green);
        box-shadow: 0 0 0 2px rgba(38, 166, 154, 0.1);
        background: white;
    }

    input:hover,
    select:hover {
        border-color: #b9c3c3;
    }

    select {
        cursor: pointer;
    }

    .error {
        display: block;
        min-height: 16px;
        color: var(--error);
        font-size: 10px;
        margin-top: 3px;
    }

    .membership {
        grid-column: span 2;
    }

    .membership select {
        height: 44px;
    }

    button {
        width: 100%;
        height: 46px;
        margin-top: 12px;
        border: none;
        border-radius: 5px;
        background: var(--green);
        color: white;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 1.4px;
        cursor: pointer;
        transition: 0.2s ease;
    }

    button:hover {
        background: var(--green-dark);
        transform: translateY(-1px);
        box-shadow: 0 6px 15px rgba(38, 166, 154, 0.2);
    }

    button:active {
        transform: translateY(0);
    }

    .success {
        min-height: 18px;
        color: var(--success);
        font-size: 12px;
        font-weight: 700;
        text-align: center;
        margin: 12px 0 0;
    }

    @media (max-width: 800px) {
        body {
            padding: 15px;
        }

        .side {
            grid-template-columns: 1fr 1fr;
            min-height: 320px;
            padding: 30px;
        }

        .side-bottom {
            grid-column: span 2;
            margin-top: 10px;
        }

        .form-area {
            padding: 35px 30px;
        }
    }

    @media (max-width: 550px) {
        .side {
            display: block;
            padding: 30px 25px;
        }

        .logo {
            position: relative;
            top: auto;
            left: auto;
            margin-bottom: 25px;
        }

        .side-content {
            margin-top: 0;
        }

        .side-bottom {
            margin-top: 25px;
        }

        .side-content h1 {
            font-size: 28px;
        }

        .form-area {
            padding: 30px 20px;
        }

        .form-grid {
            grid-template-columns: 1fr;
        }

        .membership {
            grid-column: span 1;
        }

        .header {
            align-items: flex-start;
        }
    }
    </style>
</head>

<body>

<div class="container">

    <div class="side">

        <div class="logo">
            FITNESS<span>FIRST</span>
        </div>

        <div class="side-content">

            <h1>
                Gym<br>
                <span>Admission</span>
            </h1>

        </div>

        <div class="side-bottom">

            <div class="mini-info">

                <div class="mini-box">
                    <strong>24/7</strong>
                    <span>Access</span>
                </div>

                <div class="mini-box">
                    <strong>50+</strong>
                    <span>Equipment</span>
                </div>

                <div class="mini-box">
                    <strong>10K+</strong>
                    <span>Members</span>
                </div>

            </div>

        </div>

    </div>

    <div class="form-area">

        <div class="form-wrapper">

            <div class="header">

                <div>
                    <div class="header-label">
                        Registration
                    </div>

                    <h2>
                        Member <span>Details</span>
                    </h2>
                </div>

                <div class="form-number">
                    01
                </div>

            </div>

            <form id="gymForm">

                <div class="form-grid">

                    <div class="field">
                        <label>Full Name</label>
                        <input
                            type="text"
                            id="name"
                            placeholder="Enter your full name"
                        >
                        <span id="nameError" class="error"></span>
                    </div>

                    <div class="field">
                        <label>Age</label>
                        <input
                            type="number"
                            id="age"
                            placeholder="Enter your age"
                        >
                        <span id="ageError" class="error"></span>
                    </div>

                    <div class="field">
                        <label>Email</label>
                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                        >
                        <span id="emailError" class="error"></span>
                    </div>

                    <div class="field">
                        <label>Mobile Number</label>
                        <input
                            type="text"
                            id="mobile"
                            placeholder="Enter 10-digit number"
                        >
                        <span id="mobileError" class="error"></span>
                    </div>

                    <div class="field membership">

                        <label>Membership Plan</label>

                        <select id="plan">
                            <option value="">Select Plan</option>
                            <option>Monthly</option>
                            <option>Quarterly</option>
                            <option>Yearly</option>
                        </select>

                        <span id="planError" class="error"></span>

                    </div>

                </div>

                <button type="submit">
                    JOIN NOW&nbsp;&nbsp; →
                </button>

                <p id="result" class="success"></p>

            </form>

        </div>

    </div>

</div>

<script>

// Name Validation (input event)
document.getElementById("name").addEventListener("input", function(){
    let name=this.value;
    if(/^[A-Za-z ]+$/.test(name)){
        document.getElementById("nameError").innerHTML="";
    }else{
        document.getElementById("nameError").innerHTML="Only letters allowed.";
    }
});

// Age Validation (blur event)
document.getElementById("age").addEventListener("blur", function(){
    let age=this.value;
    if(age>=16 && age<=60){
        document.getElementById("ageError").innerHTML="";
    }else{
        document.getElementById("ageError").innerHTML="Age must be between 16 and 60.";
    }
});

// Email Validation (input event)
document.getElementById("email").addEventListener("input", function(){
    let email=this.value;
    let pattern=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    if(pattern.test(email)){
        document.getElementById("emailError").innerHTML="";
    }else{
        document.getElementById("emailError").innerHTML="Invalid email.";
    }
});

// Mobile Validation (input event)
document.getElementById("mobile").addEventListener("input", function(){
    let mobile=this.value;

    if(/^\d{10}$/.test(mobile)){
        document.getElementById("mobileError").innerHTML="";
    }else{
        document.getElementById("mobileError").innerHTML="Enter 10-digit mobile number.";
    }
});

// Membership Validation (change event)
document.getElementById("plan").addEventListener("change", function(){
    if(this.value==""){
        document.getElementById("planError").innerHTML="Please select a plan.";
    }else{
        document.getElementById("planError").innerHTML="";
    }
});

// Form Submission (submit event)
document.getElementById("gymForm").addEventListener("submit", function(e){

    e.preventDefault();

    if(
        document.getElementById("nameError").innerHTML=="" &&
        document.getElementById("ageError").innerHTML=="" &&
        document.getElementById("emailError").innerHTML=="" &&
        document.getElementById("mobileError").innerHTML=="" &&
        document.getElementById("plan").value!=""
    ){
        document.getElementById("result").innerHTML="Gym Admission Successful!";
    }
    else{
        document.getElementById("result").innerHTML="";
        alert("Please correct the errors before submitting.");
    }
});

</script>

</body>
</html>
