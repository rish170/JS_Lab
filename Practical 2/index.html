<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStore - Billing Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <h1>TechStore</h1>
        <p>Your one-stop shop for modern tech</p>
    </header>

    <main class="container">
        <section class="products-section">
            <h2>Our Products</h2>
            <div class="products-grid" id="productsGrid">
                <!-- Flashcards will be generated by JS -->
            </div>
        </section>

        <section class="checkout-section">
            <h2>Checkout Details</h2>
            <form id="checkoutForm" novalidate>
                <div class="form-group">
                    <label for="address">Delivery Address</label>
                    <textarea id="address" rows="3" placeholder="Enter your full delivery address" required></textarea>
                </div>

                <div class="form-group">
                    <label>Type of Delivery</label>
                    <div class="radio-group">
                        <label>
                            <input type="radio" name="deliveryType" value="standard" checked>
                            Standard Delivery (4-5 days) - Free
                        </label>
                        <label>
                            <input type="radio" name="deliveryType" value="express">
                            Express Delivery (24 hours) - ₹149
                        </label>
                    </div>
                </div>

                <div class="form-group checkbox-group">
                    <label>
                        <input type="checkbox" id="giftCheckbox">
                        Send as a gift
                    </label>
                </div>

                <div class="form-group hidden" id="giftMessageContainer">
                    <label for="giftMessage">Gift Message (Max 50 words)</label>
                    <textarea id="giftMessage" rows="2" placeholder="Write a nice message..."></textarea>
                    <small id="wordCount">0 / 50 words</small>
                </div>

                <div class="form-group">
                    <label for="paymentMode">Mode of Payment</label>
                    <select id="paymentMode" required>
                        <option value="" disabled selected hidden>Select Payment Method</option>
                        <option value="UPI">UPI</option>
                        <option value="Credit Card">Credit Card</option>
                        <option value="Debit Card">Debit Card</option>
                        <option value="Cash on Delivery">Cash on Delivery</option>
                    </select>
                </div>

                <button type="submit" class="btn-checkout">Calculate Bill & Checkout</button>
            </form>
        </section>

        <!-- Receipt Section -->
        <section id="receiptSection" class="receipt-section hidden">
            <h2>Order Receipt</h2>
            <div id="receiptContent" class="receipt-content"></div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
