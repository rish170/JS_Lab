<!DOCTYPE html>
<html>
<head>
    <title>LocalStorage and SessionStorage</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 50px;
            transition: 0.3s;
        }

        .dark {
            background-color: #222;
            color: white;
        }

        button {
            padding: 10px 20px;
            margin: 10px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>Theme Preference</h1>

    <button onclick="setTheme('light')">Light Theme</button>
    <button onclick="setTheme('dark')">Dark Theme</button>
    <button onclick="clearTheme()">Clear Preference</button>

    <p id="message"></p>

    <script>

        // Load saved theme when page opens
        window.onload = function () {

            // First check localStorage
            let savedTheme = localStorage.getItem("theme");

            if (savedTheme) {
                setTheme(savedTheme);
            }
        };


        // Save theme in localStorage
        function setTheme(theme) {

            // Apply theme
            if (theme === "dark") {
                document.body.classList.add("dark");
            } else {
                document.body.classList.remove("dark");
            }

            // Save permanently
            localStorage.setItem("theme", theme);

            // Also save current session
            sessionStorage.setItem("currentTheme", theme);

            document.getElementById("message").innerText =
                "Theme saved: " + theme;
        }


        // Clear stored preference
        function clearTheme() {

            localStorage.removeItem("theme");
            sessionStorage.removeItem("currentTheme");

            document.body.classList.remove("dark");

            document.getElementById("message").innerText =
                "Theme preference cleared.";
        }

    </script>

</body>
</html>
