<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Demo</title>

    <!-- Internal JavaScript -->
    <script>
        function showWelcome() {

            // Get values from input boxes
            let name = document.getElementById("name").value;
            let age = document.getElementById("age").value;

            // Display welcome message
            document.getElementById("output").innerHTML =
                "<h2>Welcome, " + name + "!</h2>" +
                "<p>Your Age is: " + age + "</p>";

            // Console Methods
            console.log("User Name: " + name);
            console.info("User Age: " + age);
            console.warn("This is a warning message...");
            console.error("This is an error message (Demo Purpose)");
        }
    </script>
</head>

<body>
    <h1>User Information</h1>
    <label>Enter Name:</label><br/>
    <input type="text" id="name" placeholder="Enter Name"><br/><br/>

    <label>Enter Age:</label><br/>
    <input type="number" id="age" placeholder="Enter Age"><br/><br/>

    <button onclick="showWelcome(); greet();">Submit</button>
    <hr>
    <div id="output"></div>

    <script src="exp1_script.js"></script>
    
</body>
</html>
